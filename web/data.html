<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browse datasets</title>
  <link rel="preload" href="/assets/fonts/JetBrainsMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/styles.css">
  <script type="module" src="/assets/data.js"></script>
</head>
<body>
  <main class="menu browse">
    <a class="plain small" href="/">← menu</a>
    <h1>Browse datasets</h1>
    <nav id="datasets" class="dataset-tabs" aria-label="Dataset"></nav>
    <p id="about" class="small"></p>
    <div class="pager small">
      <button id="prev" class="plain" type="button">← previous</button>
      <span id="range" role="status" aria-live="polite"></span>
      <button id="next" class="plain" type="button">next →</button>
      <button id="random" class="plain" type="button">random page</button>
    </div>
    <ol id="rows" class="rows"></ol>
  </main>
</body>
</html>
